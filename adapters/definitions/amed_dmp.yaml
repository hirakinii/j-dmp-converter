# AMED DMP mapping definition (R7 version)
# Maps CIR fields to AMED Excel form cell coordinates.
# Template sheet: DMP様式
# Layout: Vertical questionnaire format with labels in B-C, values in D.

meta:
  format_id: amed
  format_name: "AMED データマネジメントプラン"
  file_type: xlsx
  template_sheet: "DMP様式"

mapping:
  # --- Section 1: 研究開発課題情報 ---
  creation_date:
    cir_path: "created"
    excel_cell: "D4"
    excel_sheet: "DMP様式"
    required: false

  project_number:
    cir_path: "project.0.erad_project_id"
    excel_cell: "D5"
    excel_sheet: "DMP様式"
    required: false

  program_name:
    cir_path: "project.0.description"
    excel_cell: "D7"
    excel_sheet: "DMP様式"
    required: false

  project_title:
    cir_path: "project.0.title"
    excel_cell: "D8"
    excel_sheet: "DMP様式"
    required: true

  project_period:
    cir_path: "project.0.start"
    excel_cell: "D9"
    excel_sheet: "DMP様式"
    required: false

  # --- PI information ---
  principal_investigator_affiliation:
    cir_path: "contact.affiliation.0.name"
    excel_cell: "D10"
    excel_sheet: "DMP様式"
    required: true

  principal_investigator_name:
    cir_path: "contact.name"
    excel_cell: "D12"
    excel_sheet: "DMP様式"
    required: true

  # --- Section 3: 研究開発データ① ---
  dataset_title:
    cir_path: "dataset.0.title"
    excel_cell: "D17"
    excel_sheet: "DMP様式"
    required: true

  dataset_description:
    cir_path: "dataset.0.description"
    excel_cell: "D20"
    excel_sheet: "DMP様式"
    required: false

  data_sharing_method:
    cir_path: "dataset.0.distribution.0.data_access"
    excel_cell: "D25"
    excel_sheet: "DMP様式"
    required: true

  publication_date:
    cir_path: "dataset.0.issued"
    excel_cell: "D28"
    excel_sheet: "DMP様式"
    required: false

  repository_url:
    cir_path: "dataset.0.distribution.0.host.url"
    excel_cell: "D32"
    excel_sheet: "DMP様式"
    required: false

  # --- Section 4: データ管理人材 ---
  data_management_institution:
    cir_path: "contributor.0.affiliation.0.name"
    excel_cell: "D37"
    excel_sheet: "DMP様式"
    required: false

  data_manager_name:
    cir_path: "contributor.0.name"
    excel_cell: "D38"
    excel_sheet: "DMP様式"
    required: false

  data_manager_contact:
    cir_path: "contributor.0.mbox"
    excel_cell: "D39"
    excel_sheet: "DMP様式"
    required: false
