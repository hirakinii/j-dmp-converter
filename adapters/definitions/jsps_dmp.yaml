# JSPS (日本学術振興会) DMP mapping definition
# Maps CIR fields to JSPS Excel form cell coordinates.

meta:
  format_id: jsps
  format_name: "JSPS データマネジメントプラン"
  file_type: xlsx

mapping:
  project_title:
    cir_path: "project.0.title"
    excel_cell: "C5"
    required: true

  principal_investigator_name:
    cir_path: "contact.name"
    excel_cell: "C3"
    required: true

  principal_investigator_affiliation:
    cir_path: "contact.affiliation.0.name"
    excel_cell: "C4"
    required: true

  erad_project_id:
    cir_path: "project.0.erad_project_id"
    excel_cell: "C6"
    required: true

  erad_researcher_id:
    cir_path: "contributor.0.erad_researcher_id"
    excel_cell: "C7"
    required: true

  project_start:
    cir_path: "project.0.start"
    excel_cell: "C8"
    required: true

  project_end:
    cir_path: "project.0.end"
    excel_cell: "C9"
    required: true

  dataset_title:
    cir_path: "dataset.0.title"
    excel_cell: "C12"
    required: true

  dataset_description:
    cir_path: "dataset.0.description"
    excel_cell: "C13"
    required: true

  data_type:
    cir_path: "dataset.0.type"
    excel_cell: "C14"
    required: true

  data_access:
    cir_path: "dataset.0.distribution.0.data_access"
    excel_cell: "C15"
    required: true

  repository_url:
    cir_path: "dataset.0.distribution.0.host.url"
    excel_cell: "C16"
    required: false

  data_format:
    cir_path: "dataset.0.distribution.0.format.0"
    excel_cell: "C17"
    required: true

  license:
    cir_path: "dataset.0.distribution.0.license.0.license_ref"
    excel_cell: "C18"
    required: true

  personal_data:
    cir_path: "dataset.0.personal_data"
    excel_cell: "C19"
    required: true

  sensitive_data:
    cir_path: "dataset.0.sensitive_data"
    excel_cell: "C20"
    required: true

  preservation_statement:
    cir_path: "dataset.0.preservation_statement"
    excel_cell: "C21"
    required: true
