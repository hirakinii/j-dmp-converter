[project]
name = "j-dmp-converter"
version = "0.1.0"
description = "Japanese DMP format converter with Common Intermediate Representation (CIR)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic[email]>=2.0,<3.0",
    "openpyxl>=3.1,<4.0",
    "python-docx>=1.0,<2.0",
    "docxtpl>=0.16,<1.0",
    "pyyaml>=6.0,<7.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "python-multipart>=0.0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=4.0,<6.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.3,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
